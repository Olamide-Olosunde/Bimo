name: bimo

services:
  backend:
    image: bimo_be_local:v1
    env_file:
      - ./backend/.env.list
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    image: bimo_fe_local:v1
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped